[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

# allow openalea to be a namespace package
[tool.setuptools.packages.find]
where = ["src"]


[project]
name = "pycropml"
dynamic = ["version", "readme"]
authors = [
    { name = "Cyrille Ahmed Midingoyi", email = "cyrille_ahmed.midingoyi@cirad.fr" },
    { name = "Christophe Pradal", email = "christophe.pradal@cirad.fr" },
]
description = "A Python library to generate components from Crop2ML declarative language"
license = { file = "LICENSE" }
requires-python = ">=3.8,<3.13"
classifiers = [
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Framework :: OpenAlea",
    "Framework :: Crop2ML",
]

dependencies = [
    "nbformat",
    "numpy",
    "Cython>=0.29.37,<4",
    "networkx",
    "graphviz",
    "pydot",
    "PyYAML",
    "unyt",
    "IPython",
    "antlr4-python3-runtime==4.8",
    "xmlformatter",
    "pandas",
]

[tool.setuptools.dynamic]
version = { attr = "pycropml.version.__version__" }
readme = { file = ["README.rst"] }


[tool.setuptools.package-data]
pycropml = ["**/*.json", "**/*.xml", "**/*.ini"]

# section specific to conda-only distributed package (not used by pip yet)
[tool.conda.environment]
channels = ["openalea3", "conda-forge"]
dependencies = [
    "nbformat",
    "numpy",
    "Cython>=0.29.37,<4",
    "networkx",
    "graphviz",
    "pydot",
    "pyyaml",
    "unyt",
    "IPython",
    "antlr4-python3-runtime==4.8",
    "xmlformatter",
    "pandas",
]

[project.optional-dependencies]
test = ["pytest"]
doc = [
    "sphinx-favicon",
    "sphinx-rtd-theme",
    "pydata-sphinx-theme",
    "myst-parser",
    "nbsphinx",
]

[project.urls]
Homepage = "https://github.com/AgriculturalModelExchangeInitiative/PyCrop2ML"
"Bug Tracker" = "https://github.com/AgriculturalModelExchangeInitiative/PyCrop2ML/issues"
Discussions = "https://github.com/AgriculturalModelExchangeInitiative/PyCrop2ML/discussions"
Changelog = "https://github.com/AgriculturalModelExchangeInitiative/PyCrop2ML/releases"

#[tool.setuptools.package-data]
#"pycropml_data" = ["*"]

[project.scripts]
cyml = "pycropml.main:main"
cyml-check-composition = "pycropml.transpiler.antlr_py.validate_composition:main"

[tool.pixi.workspace]
channels = ["conda-forge", "openalea3"]
platforms = ["win-64", "linux-64"]

[tool.pixi.pypi-dependencies]
pycropml = { path = ".", editable = true }

[tool.pixi.tasks]

[tool.pixi.dependencies]
pixi-pycharm = ">=0.0.10,<0.0.11"
antlr4-python3-runtime = "==4.8"
cython = ">=3.2.4,<4"
numpy = "==2.0.2"
pandas = "==2.2.3"
path = ">=17.1.1,<18"
six = ">=1.17.0,<2"
nbformat = ">=5.10.4,<6"
nbsphinx = ">=0.9.8,<0.10"
networkx = ">=3.6.1,<4"
pyyaml = ">=6.0.3,<7"
unyt = ">=3.0.4,<4"
ipython = ">=9.9.0,<10"
xmlformatter = ">=0.2.8,<0.3"
"openalea.core" = ">=2.5.0,<3"
graphviz = ">=14.1.1,<15"
pydot = ">=4.0.1,<5"
